<!-- templates/components/tabs.html -->
<nav class="tabs">
  <div class="tabs-left">
    {% for d in dimensions %}
      <a class="tab {% if current_dim.slug == d.slug %}active{% endif %}"
         href="{{ url_for('planes.index', dim=d.slug) }}">
        {{ d.label }}
      </a>
    {% endfor %}
  </div>
  <div class="tabs-right">
    <a class="btn-export" href="{{ url_for('planes.export_plans') }}" title="Exportar el portafolio a Excel">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M14 11V14H2V11H0V14C0 15.1 0.9 16 2 16H14C15.1 16 16 15.1 16 14V11H14Z" fill="currentColor"/>
        <path d="M13 7L11.59 5.59L9 8.17V0H7V8.17L4.41 5.59L3 7L8 12L13 7Z" fill="currentColor"/>
      </svg>
      Exportar Portafolio
    </a>
    <a class="btn-small" href="{{ url_for('manual.index') }}" title="Abrir manual de usuario" style="margin-left: 10px;">
      📖 Manual de Usuario
    </a>
    <a class="btn-export" href="{{ url_for('prompts.index') }}" title="Gestionar versiones del SuperPrompt" style="margin-left: 10px;">
      📝 Gestión de Prompts
    </a>
  </div>
</nav>
